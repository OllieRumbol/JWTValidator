# Deploys main to GitHub Pages with GitHub's Pages actions (plan sections 3.5 and 8).
# To roll back, revert the change in a pull request into main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A running deploy is never cancelled, as in GitHub's Pages starter workflow.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only main is deployed, also when the workflow is run by hand from another branch.
    # The deploy job needs this one, so it is skipped too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No later step needs the token, so it is not left in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job can publish the site.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
