<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Draws the page at the device width. Released with the phone menu (spec section 6.1.2, item 5). -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" />
    <title>JWT Validator</title>
    <meta
      name="description"
      content="Documentation for JWTValidator, a .NET library that validates JSON Web Tokens."
    />
    <!-- Link previews (spec section 6.1.9). Open Graph needs absolute addresses. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JWT Validator" />
    <meta
      property="og:description"
      content="Documentation for JWTValidator, a .NET library that validates JSON Web Tokens."
    />
    <meta
      property="og:url"
      content="https://ollierumbol.github.io/JWTValidator/"
    />
    <meta
      property="og:image"
      content="https://ollierumbol.github.io/JWTValidator/og-image.png"
    />
    <!-- The size lets a service show the image on the first share, before it fetches it. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The JWT Validator logo and name" />
  </head>
  <body>
    <noscript>
      <p>
        JWT Validator needs JavaScript. Turn on JavaScript in your browser to
        read this site.
      </p>
    </noscript>
    <div id="app-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
