<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approved design: Logo and package icon</title>
<!-- Approved design mockup. Fonts load from Google Fonts here only; the site hosts its own. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div style="width: 760px; height: 520px; box-sizing: border-box; padding: 36px; background: #FFFFFF; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1B1A22; display: flex; flex-direction: column; gap: 28px">

  <div style="display: flex; gap: 20px">
    <div style="flex: 1 1 0; border: 1px solid #E3E0EC; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 14px">
      <p style="margin: 0; font-size: 13px; font-weight: 600; color: #55526A">Wordmark on light</p>
      <div style="display: flex; align-items: center; gap: 14px">
        <span aria-hidden="true" style="display: flex; gap: 5px">
          <span style="width: 13px; height: 32px; border-radius: 4px; background: #E5427A"></span>
          <span style="width: 13px; height: 32px; border-radius: 4px; background: #9447D6"></span>
          <span style="width: 13px; height: 32px; border-radius: 4px; background: #1C9CC9"></span>
        </span>
        <span style="font-weight: 700; font-size: 28px; letter-spacing: -0.01em">JWT Validator</span>
      </div>
    </div>
    <div style="flex: 1 1 0; border-radius: 12px; padding: 28px; background: #0E1116; color: #E6EDF3; display: flex; flex-direction: column; gap: 14px">
      <p style="margin: 0; font-size: 13px; font-weight: 600; color: #B8C2CC">Wordmark on dark</p>
      <div style="display: flex; align-items: center; gap: 14px">
        <span aria-hidden="true" style="display: flex; gap: 5px">
          <span style="width: 13px; height: 32px; border-radius: 4px; background: #FF5C8A"></span>
          <span style="width: 13px; height: 32px; border-radius: 4px; background: #C77DFF"></span>
          <span style="width: 13px; height: 32px; border-radius: 4px; background: #3CC8F5"></span>
        </span>
        <span style="font-weight: 700; font-size: 28px; letter-spacing: -0.01em">JWT Validator</span>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <p style="margin: 0; font-size: 13px; font-weight: 600; color: #55526A">Package icon: 128, 64 and 32 pixels, on light and dark tiles</p>
    <div style="display: flex; align-items: flex-end; gap: 24px">
      <div role="img" aria-label="Package icon, light, 128 pixels" style="width: 128px; height: 128px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E3E0EC; display: grid; place-items: center">
        <span style="display: flex; gap: 8px"><span style="width: 20px; height: 64px; border-radius: 6px; background: #E5427A"></span><span style="width: 20px; height: 64px; border-radius: 6px; background: #9447D6"></span><span style="width: 20px; height: 64px; border-radius: 6px; background: #1C9CC9"></span></span>
      </div>
      <div role="img" aria-label="Package icon, light, 64 pixels" style="width: 64px; height: 64px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E0EC; display: grid; place-items: center">
        <span style="display: flex; gap: 4px"><span style="width: 10px; height: 32px; border-radius: 3px; background: #E5427A"></span><span style="width: 10px; height: 32px; border-radius: 3px; background: #9447D6"></span><span style="width: 10px; height: 32px; border-radius: 3px; background: #1C9CC9"></span></span>
      </div>
      <div role="img" aria-label="Package icon, light, 32 pixels" style="width: 32px; height: 32px; border-radius: 6px; background: #FFFFFF; border: 1px solid #E3E0EC; display: grid; place-items: center">
        <span style="display: flex; gap: 2px"><span style="width: 5px; height: 16px; border-radius: 1.5px; background: #E5427A"></span><span style="width: 5px; height: 16px; border-radius: 1.5px; background: #9447D6"></span><span style="width: 5px; height: 16px; border-radius: 1.5px; background: #1C9CC9"></span></span>
      </div>
      <div style="width: 24px"></div>
      <div role="img" aria-label="Package icon, dark, 128 pixels" style="width: 128px; height: 128px; border-radius: 24px; background: #0E1116; display: grid; place-items: center">
        <span style="display: flex; gap: 8px"><span style="width: 20px; height: 64px; border-radius: 6px; background: #FF5C8A"></span><span style="width: 20px; height: 64px; border-radius: 6px; background: #C77DFF"></span><span style="width: 20px; height: 64px; border-radius: 6px; background: #3CC8F5"></span></span>
      </div>
      <div role="img" aria-label="Package icon, dark, 64 pixels" style="width: 64px; height: 64px; border-radius: 12px; background: #0E1116; display: grid; place-items: center">
        <span style="display: flex; gap: 4px"><span style="width: 10px; height: 32px; border-radius: 3px; background: #FF5C8A"></span><span style="width: 10px; height: 32px; border-radius: 3px; background: #C77DFF"></span><span style="width: 10px; height: 32px; border-radius: 3px; background: #3CC8F5"></span></span>
      </div>
      <div role="img" aria-label="Package icon, dark, 32 pixels" style="width: 32px; height: 32px; border-radius: 6px; background: #0E1116; display: grid; place-items: center">
        <span style="display: flex; gap: 2px"><span style="width: 5px; height: 16px; border-radius: 1.5px; background: #FF5C8A"></span><span style="width: 5px; height: 16px; border-radius: 1.5px; background: #C77DFF"></span><span style="width: 5px; height: 16px; border-radius: 1.5px; background: #3CC8F5"></span></span>
      </div>
    </div>
  </div>

  <p style="margin: 0; font-size: 14px; color: #55526A; max-width: 640px">The three bars are the header, payload and signature of a token. The light set uses deeper shades so each bar has at least 3:1 contrast on white.</p>
</div>
</body>
</html>
